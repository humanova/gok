<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gök radar</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="title-area">
        <span id="title">gök radar</span>
          <span class="dot" title="canlı"></span>
          <a id="atlas-link" href="/map" title="Konu atlasını aç"><span aria-hidden="true">🌐</span> atlas</a>
      </div>
      <div id="stats"><span id="last-updated">güncelleniyor</span></div>
      <div id="view-toggle" role="group" aria-label="Görünüm">
        <button class="view-btn active" type="button" data-view="grid" aria-pressed="true" title="Radar görünümü">
          <span class="view-icon view-icon-grid" aria-hidden="true"></span>
          <span class="sr-only">Radar görünümü</span>
        </button>
        <button class="view-btn" type="button" data-view="list" aria-pressed="false" title="Liste görünümü">
          <span class="view-icon view-icon-list" aria-hidden="true"></span>
          <span class="sr-only">Liste görünümü</span>
        </button>
      </div>
      <button id="event-toggle" type="button" aria-controls="debug-panel" aria-expanded="false">
        olaylar <span id="event-toggle-count">0</span>
      </button>
    </header>

    <main id="main">
      <div id="radar-wrap">
        <div id="grid"></div>
        <div id="topic-list" aria-label="Gündemdeki konular"></div>
      </div>
      <aside id="brief-panel" aria-live="polite">
        <header id="brief-header">
          <div id="brief-heading">
            <span id="brief-kicker">KONU ÖZETİ</span>
            <h2 id="brief-topic">—</h2>
          </div>
          <div id="brief-actions">
            <a id="brief-search" class="brief-action" href="#" target="_blank" rel="noopener noreferrer" title="Google'da ara"><img src="https://www.google.com/favicon.ico" alt="">ara</a>
            <a id="brief-topic-link" class="brief-action" href="#" target="_blank" rel="noopener noreferrer" title="Ekşi Sözlük başlığını aç"><img src="https://eksisozluk.com/favicon.ico" alt="">git</a>
            <button id="brief-close" type="button" aria-label="Konu özetini kapat">×</button>
          </div>
        </header>
        <div id="brief-content"></div>
      </aside>
      <aside id="debug-panel">
        <div id="debug-header">
          <span id="debug-title">olaylar · 0 sırada</span>
          <button id="event-follow" type="button" title="Yeni olayları otomatik takip et">takipte</button>
        </div>
        <ul id="debug-list"></ul>
      </aside>
    </main>

    <footer id="bottombar">
      <div id="timeline-scrubber">
        <div id="scrubber-wrap">
          <div id="scrubber-track">
            <input type="range" id="scrubber" min="0" max="1000" value="1000" step="1">
            <span id="live-marker" title="6 dakika gecikmeli canlı konum"></span>
          </div>
            <div id="speed-control" role="group" aria-label="Oynatma hızı">
              <button class="speed-btn active" type="button" data-speed="1">1×</button>
              <button class="speed-btn" type="button" data-speed="60">60×</button>
            </div>
          <button id="go-live" type="button">canlıya sar</button>
        </div>
        <div class="timeline-ticks" aria-hidden="true">
          <span>−24 sa</span><span>−18 sa</span><span>−12 sa</span><span>−6 sa</span><span>canlı</span>
        </div>
        <div id="playback-time">—</div>
      </div>
    </footer>
    <div id="replay-notice" role="status" aria-live="polite"><span id="replay-notice-text">son 1 saat oynatılıyor</span> <span>&gt;&gt;&gt;</span></div>
  </div>
  <script src="static/app.js"></script>
</body>
</html>
